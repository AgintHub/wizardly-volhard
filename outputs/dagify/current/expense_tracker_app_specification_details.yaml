        \        ,date:date)\".\n\n    Returns\n    -------\n    str\n        A JSON‑encoded\
        \ dictionary where each top‑level key is a table name\n        and each value\
        \ is a mapping of column names to validation rule\n        dictionaries (e.g.,\
        \ type, required, max_length, format).\n\n    Raises\n    ------\n    ValueError\n\
        \        If `db_tables` is empty or does not contain any parsable table\n\
        \        definitions.\n    TypeError\n        If `db_tables` is not a string.\n\
        \n    Examples\n    --------\n    >>> derive_client_side_validation_rules('Users(id:int,name:str,email:str)')\n\
        \    '{\"Users\": {\"id\": {\"type\": \"int\", \"required\": true}, \"name\"\
        : {\"type\": \"str\",\n    \"required\": true, \"max_length\": 255}, \"email\"\
        : {\"type\": \"str\", \"required\":\n    true, \"format\": \"email\"}}}'\n\
        \n    >>> derive_client_side_validation_rules('Expenses(id:int,amount:float,date:d\n\
        \    ate)')\n    '{\"Expenses\": {\"id\": {\"type\": \"int\", \"required\"\
        : true}, \"amount\": {\"type\":\n    \"float\", \"required\": true, \"min\"\
        : 0}, \"date\": {\"type\": \"date\", \"required\":\n    true}}}'\n\n    \"\
        \"\"\n    \n    if not isinstance(db_tables, str):\n        raise TypeError(\"\
        db_tables must be a string\")\n    \n    if not db_tables.strip():\n     \
