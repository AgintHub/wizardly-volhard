dag_type: pure
description: Generated workflow from UI to build a fully functional and tested expense
  tracker application with authentication, data storage, UI components, and testing.
name: expense_tracker_app_specification
nodes:
  create_user_authentication:
    agent: false
    code_node_type: shim
    description: Develop user account management features for secure login and data
      isolation.
    implementation: "from ._create_user_authentication.validate_required_auth_components\
      \ import validate_required_auth_components\nfrom ._create_user_authentication.generate_auth_configuration\
      \ import generate_auth_configuration\nfrom ._create_user_authentication.generate_user_registration_logic\
      \ import generate_user_registration_logic\nfrom ._create_user_authentication.generate_login_logout_logic\
      \ import generate_login_logout_logic\nfrom ._create_user_authentication.generate_password_reset_logic\
      \ import generate_password_reset_logic\nfrom ._create_user_authentication.generate_session_management_logic\
      \ import generate_session_management_logic\nfrom ._create_user_authentication.generate_ui_integration_code\
      \ import generate_ui_integration_code\nfrom ._create_user_authentication.compile_auth_module\
      \ import compile_auth_module\n\nfrom pydantic import BaseModel, Field\nfrom\
      \ typing import List\n\n\nclass DesignUiComponentsOutput(BaseModel):\n    \"\
      \"\"Pydantic model for design_ui_components node outputs.\"\"\"\n    ui_components:\
      \ List[str] = (\n        Field(..., description=\"Names of UI components and\
      \ screens derived from the functional requirements\")\n    )\n\n\nclass CreateUserAuthenticationOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for create_user_authentication node outputs.\"\"\"\
      \n    auth_module: str = (\n        Field(..., description=\"Identifier or filename\
      \ of the authentication module/code\")\n    )\n\n\ndef create_user_authentication(design_ui_components_input:\
      \ DesignUiComponentsOutput, **kwargs) -> CreateUserAuthenticationOutput:\n \
      \   \"\"\"\n    Create an authentication module based on UI component specifications.\n\
      \n    Parameters\n    ----------\n    ui_components : list[str]\n        List\
      \ of UI component names produced by the design_ui_components node\n        (e.g.,\
      \ ['login_screen', 'signup_form']).\n\n    Returns\n    -------\n    str\n \
      \       Path or identifier of the generated authentication module (e.g.,\n \
      \       'auth.py').\n\n    Raises\n    ------\n    ValueError\n        If required\
      \ UI components for authentication (e.g., 'login_screen')\n        are missing\
      \ from ui_components.\n    RuntimeError\n        If the authentication module\
      \ cannot be generated due to internal\n        errors.\n\n    Examples\n   \
      \ --------\n    >>> ui = ['login_screen', 'signup_form', 'settings_page']\n\
      \    >>> auth_path = create_auth_module(ui)\n    'auth.py'\n\n    >>> ui = ['dashboard',\
      \ 'expense_list']\n    >>> create_auth_module(ui)\n    ValueError: Missing required\
      \ authentication UI components: login_screen\n\n    \"\"\"\n    ui_components:\
      \ List[str] = design_ui_components_input.ui_components\n    \n    required_components:\
      \ List[str] = validate_required_auth_components(ui_components=ui_components)\n\
      \    \n    auth_config: dict = generate_auth_configuration(ui_components=ui_components)\n\
      \    \n    registration_code: str = generate_user_registration_logic(config=auth_config)\n\
      \    \n    login_code: str = generate_login_logout_logic(config=auth_config)\n\
      \    \n    password_reset_code: str = generate_password_reset_logic(config=auth_config)\n\
      \    \n    session_management_code: str = generate_session_management_logic(config=auth_config)\n\
      \    \n    ui_integration_code: str = generate_ui_integration_code(ui_components=ui_components,\
      \ config=auth_config)\n    \n    auth_module_path: str = compile_auth_module(registration=registration_code,\
      \ login=login_code, password_reset=password_reset_code, session_management=session_management_code,\
      \ ui_integration=ui_integration_code)\n    \n    return CreateUserAuthenticationOutput(auth_module=auth_module_path)"
    name: create_user_authentication
    nodes_depended_on:
    - design_ui_components
    nodes_dependent_on:
    - write_tests
    output_structure:
    - description: Identifier or filename of the authentication module/code
      key: auth_module
      type: str
    prd:
      conceptual_info: Generates the authentication backend module that provides secure
        user registration, login, logout, password reset, and session management,
        integrating with the UI components defined by the design phase.
      docstring:
        examples:
        - lines:
          - ui = ['login_screen', 'signup_form', 'settings_page']
          - auth_path = create_auth_module(ui)
          output: '''auth.py'''
        - lines:
          - ui = ['dashboard', 'expense_list']
          - create_auth_module(ui)
          output: 'ValueError: Missing required authentication UI components: login_screen'
        parameters:
        - description: List of UI component names produced by the design_ui_components
            node (e.g., ['login_screen', 'signup_form']).
          name: ui_components
          type: list[str]
        raises:
        - description: If required UI components for authentication (e.g., 'login_screen')
            are missing from ui_components.
          type: ValueError
        - description: If the authentication module cannot be generated due to internal
            errors.
          type: RuntimeError
        returns:
          description: Path or identifier of the generated authentication module (e.g.,
            'auth.py').
          type: str
        summary: Create an authentication module based on UI component specifications.
    prompt: Implement user registration, login, logout, password management, and session
      handling, ensuring secure authentication.
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Validates that all essential authentication UI components are present
        and returns any missing component names.
      implementation: "from typing import List\n\n\ndef validate_required_auth_components(ui_components:\
        \ str) -> List[str]:\n    \"\"\"\n    Validate that the supplied UI component\
        \ list contains all mandatory\n    authentication elements and return any\
        \ that are absent.\n\n    Parameters\n    ----------\n    ui_components :\
        \ List[str]\n        A list of UI component names (strings) derived from the\
        \ functional\n        requirements.\n\n    Returns\n    -------\n    List[str]\n\
        \        A list of missing required authentication component names. An empty\n\
        \        list indicates that all required components are present.\n\n    Raises\n\
        \    ------\n    TypeError\n        If `ui_components` is not a list of strings.\n\
        \    ValueError\n        If the input list is empty or None.\n\n    Examples\n\
        \    --------\n    >>> missing = validate_required_auth_components(['Login\
        \ Screen',\n    'Registration Form'])\n    ['Password Reset Screen']\n\n \
        \   >>> missing = validate_required_auth_components(['Login Screen',\n   \
        \ 'Registration Form', 'Password Reset Screen'])\n    []\n\n    \"\"\"\n \
        \   raise NotImplementedError(\"This is a virtual stub node that needs to\
        \ be implemented\")"
      name: validate_required_auth_components
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type List[str]
        key: output
        type: List[str]
      - description: Input parameter of type str
        key: ui_components
        type: str
      prd:
        conceptual_info: This shim ensures that the generated authentication module
          has all necessary UI pieces by checking the designer's component list for
          required authentication screens and forms.
        docstring:
          examples:
          - lines:
            - missing = validate_required_auth_components(['Login Screen', 'Registration
              Form'])
            output: '[''Password Reset Screen'']'
          - lines:
            - missing = validate_required_auth_components(['Login Screen', 'Registration
              Form', 'Password Reset Screen'])
            output: '[]'
          parameters:
          - description: A list of UI component names (strings) derived from the functional
              requirements.
            name: ui_components
            type: List[str]
          raises:
          - description: If `ui_components` is not a list of strings.
            type: TypeError
          - description: If the input list is empty or None.
            type: ValueError
          returns:
            description: A list of missing required authentication component names.
              An empty list indicates that all required components are present.
            type: List[str]
          summary: Validate that the supplied UI component list contains all mandatory
            authentication elements and return any that are absent.
      prompt: Given a list of UI component names extracted from functional requirements,
        identify which mandatory authentication components (e.g., registration form,
        login screen, password‑reset screen) are missing and return them as a list
        of strings.
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: Generates an authentication configuration dictionary (as a JSON
        string) based on the supplied list of UI component names.
      implementation: "import json\n\n\ndef generate_auth_configuration(ui_components:\
        \ str) -> str:\n    \"\"\"\n    Generate a configuration dictionary for user\
        \ authentication based on UI\n    component names.\n\n    Parameters\n   \
        \ ----------\n    ui_components : List[str]\n        A list of UI component\
        \ identifiers (e.g., \"LoginScreen\",\n        \"RegistrationForm\") that\
        \ indicate which authentication features are\n        needed.\n\n    Returns\n\
        \    -------\n    str\n        A JSON‑encoded string of a dictionary containing\
        \ boolean flags and\n        optional settings required to build the authentication\
        \ module.\n\n    Raises\n    ------\n    ValueError\n        If the list does\
        \ not contain any recognized authentication‑related\n        components.\n\
        \    TypeError\n        If `ui_components` is not a list of strings.\n\n \
        \   Examples\n    --------\n    >>> config_json = generate_auth_configuration(['LoginScreen',\n\
        \    'RegistrationForm'])\n    >>> print(config_json)\n    '{\"requires_login\"\
        : true, \"requires_registration\": true,\n    \"password_reset_enabled\":\
        \ false}'\n\n    >>> config_json = generate_auth_configuration(['PasswordResetScreen'])\n\
        \    >>> print(config_json)\n    '{\"requires_login\": false, \"requires_registration\"\
        : false,\n    \"password_reset_enabled\": true}'\n\n    \"\"\"\n    \n   \
        \ try:\n        if isinstance(ui_components, str):\n            component_list\
        \ = json.loads(ui_components)\n        else:\n            component_list =\
        \ ui_components\n    except (json.JSONDecodeError, TypeError):\n        raise\
        \ TypeError(\"ui_components must be a list of strings or JSON string of a\
        \ list\")\n    \n    if not isinstance(component_list, list):\n        raise\
        \ TypeError(\"ui_components must be a list of strings\")\n    \n    if not\
        \ all(isinstance(item, str) for item in component_list):\n        raise TypeError(\"\
        ui_components must be a list of strings\")\n    \n    config = {\n       \
        \ \"requires_login\": False,\n        \"requires_registration\": False,\n\
        \        \"password_reset_enabled\": False\n    }\n    \n    auth_components_found\
        \ = False\n    \n    for component in component_list:\n        if 'login'\
        \ in component.lower() or 'signin' in component.lower():\n            config[\"\
        requires_login\"] = True\n            auth_components_found = True\n     \
        \   elif 'registration' in component.lower() or 'register' in component.lower()\
        \ or 'signup' in component.lower():\n            config[\"requires_registration\"\
        ] = True\n            auth_components_found = True\n        elif 'password'\
        \ in component.lower() and 'reset' in component.lower():\n            config[\"\
        password_reset_enabled\"] = True\n            auth_components_found = True\n\
        \    \n    if not auth_components_found:\n        raise ValueError(\"The list\
        \ does not contain any recognized authentication-related components\")\n \
        \   \n    return json.dumps(config)"
      name: generate_auth_configuration
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type dict
        key: output
        type: str
      - description: Input parameter of type str
        key: ui_components
        type: str
      prd:
        conceptual_info: This shim translates the high‑level UI component list produced
          by the design step into a concrete authentication configuration that downstream
          code generators can use to emit registration, login, password‑reset, and
          session‑management logic.
        docstring:
          examples:
          - lines:
            - config_json = generate_auth_configuration(['LoginScreen', 'RegistrationForm'])
            - print(config_json)
            output: '''{"requires_login": true, "requires_registration": true, "password_reset_enabled":
              false}'''
          - lines:
            - config_json = generate_auth_configuration(['PasswordResetScreen'])
            - print(config_json)
            output: '''{"requires_login": false, "requires_registration": false, "password_reset_enabled":
              true}'''
          parameters:
          - description: A list of UI component identifiers (e.g., "LoginScreen",
              "RegistrationForm") that indicate which authentication features are
              needed.
            name: ui_components
            type: List[str]
          raises:
          - description: If the list does not contain any recognized authentication‑related
              components.
            type: ValueError
          - description: If `ui_components` is not a list of strings.
            type: TypeError
          returns:
            description: A JSON‑encoded string of a dictionary containing boolean
              flags and optional settings required to build the authentication module.
            type: str
          summary: Generate a configuration dictionary for user authentication based
            on UI component names.
      prompt: Create a JSON‑serialisable authentication configuration dict that reflects
        the authentication‑related UI components passed in `ui_components`. The dict
        should include keys such as `requires_registration`, `requires_login`, `password_reset_enabled`,
        and any component‑specific flags inferred from the UI names.
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: Generates the user registration code as a string based on the supplied
        authentication configuration.
      implementation: "import json\n\n\ndef generate_user_registration_logic(config:\
        \ str) -> str:\n    \"\"\"\n    Generate user registration logic code from\
        \ a JSON‑encoded authentication\n    configuration.\n\n    Parameters\n  \
        \  ----------\n    config : str\n        A JSON‑encoded string describing\
        \ the authentication setup (e.g.,\n        user model name, password hashing\
        \ algorithm, required fields, email\n        verification flow).\n\n    Returns\n\
        \    -------\n    str\n        A string containing the full source code for\
        \ the registration\n        component, ready to be written to a file or concatenated\
        \ with other\n        auth code.\n\n    Raises\n    ------\n    ValueError\n\
        \        If the JSON in `config` cannot be parsed or required configuration\n\
        \        keys are missing.\n    TypeError\n        If `config` is not a string.\n\
        \n    Examples\n    --------\n    >>> config = '{\"user_model\": \"User\"\
        , \"password_hash\": \"bcrypt\",\n    \"email_verification\": true}'\n   \
        \ >>> registration_code = generate_user_registration_logic(config)\n    >>>\
        \ print(registration_code[:60])  # preview first part of generated code\n\
        \    'def register_user(...):\\n    # Validate input\\n    ...'  # truncated\n\
        \    preview of the generated source\n\n    >>> bad_config = 'not a json'\n\
        \    >>> generate_user_registration_logic(bad_config)\n    ValueError: Invalid\
        \ JSON configuration supplied to\n    generate_user_registration_logic.\n\n\
        \    \"\"\"\n    \n    if not isinstance(config, str):\n        raise TypeError(\"\
        Config must be a string\")\n    \n    try:\n        config_data = json.loads(config)\n\
        \    except json.JSONDecodeError:\n        raise ValueError(\"Invalid JSON\
        \ configuration supplied to generate_user_registration_logic.\")\n    \n \
        \   required_keys = ['user_model', 'password_hash']\n    for key in required_keys:\n\
        \        if key not in config_data:\n            raise ValueError(f\"Required\
        \ configuration key '{key}' is missing.\")\n    \n    user_model = config_data['user_model']\n\
        \    password_hash = config_data['password_hash']\n    email_verification\
        \ = config_data.get('email_verification', False)\n    required_fields = config_data.get('required_fields',\
        \ ['username', 'email', 'password'])\n    \n    code_lines = []\n    code_lines.append(\"\
        def register_user(user_data):\")\n    code_lines.append(\"    # Validate input\"\
        )\n    code_lines.append(\"    if not isinstance(user_data, dict):\")\n  \
        \  code_lines.append(\"        raise ValueError('User data must be a dictionary')\"\
        )\n    code_lines.append(\"\")\n    \n    for field in required_fields:\n\
        \        code_lines.append(f\"    if '{field}' not in user_data or not user_data['{field}']:\"\
        )\n        code_lines.append(f\"        raise ValueError('{field} is required')\"\
        )\n    code_lines.append(\"\")\n    \n    if password_hash == 'bcrypt':\n\
        \        code_lines.append(\"    import bcrypt\")\n        code_lines.append(\"\
        \    password = user_data['password'].encode('utf-8')\")\n        code_lines.append(\"\
        \    hashed_password = bcrypt.hashpw(password, bcrypt.gensalt())\")\n    elif\
        \ password_hash == 'sha256':\n        code_lines.append(\"    import hashlib\"\
        )\n        code_lines.append(\"    password = user_data['password']\")\n \
        \       code_lines.append(\"    hashed_password = hashlib.sha256(password.encode('utf-8')).hexdigest()\"\
        )\n    else:\n        code_lines.append(\"    hashed_password = user_data['password']\
        \  # No hashing\")\n    code_lines.append(\"\")\n    \n    code_lines.append(f\"\
        \    user = {user_model}()\")\n    for field in required_fields:\n       \
        \ if field == 'password':\n            code_lines.append(f\"    user.{field}\
        \ = hashed_password\")\n        else:\n            code_lines.append(f\" \
        \   user.{field} = user_data['{field}']\")\n    code_lines.append(\"\")\n\
        \    \n    if email_verification:\n        code_lines.append(\"    # Send\
        \ email verification\")\n        code_lines.append(\"    import uuid\")\n\
        \        code_lines.append(\"    verification_token = str(uuid.uuid4())\"\
        )\n        code_lines.append(\"    user.email_verified = False\")\n      \
        \  code_lines.append(\"    user.verification_token = verification_token\"\
        )\n        code_lines.append(\"    # TODO: Send verification email with token\"\
        )\n        code_lines.append(\"\")\n    \n    code_lines.append(\"    # Save\
        \ user to database\")\n    code_lines.append(\"    user.save()\")\n    code_lines.append(\"\
        \    return user\")\n    \n    return \"\\n\".join(code_lines)"
      name: generate_user_registration_logic
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: config
        type: str
      prd:
        conceptual_info: This shim produces the source code for a user registration
          routine, translating a high‑level authentication configuration into concrete
          implementation details that will later be compiled into an authentication
          module.
        docstring:
          examples:
          - lines:
            - 'config = ''{"user_model": "User", "password_hash": "bcrypt", "email_verification":
              true}'''
            - registration_code = generate_user_registration_logic(config)
            - 'print(registration_code[:60])  # preview first part of generated code'
            output: '''def register_user(...):\n    # Validate input\n    ...''  #
              truncated preview of the generated source'
          - lines:
            - bad_config = 'not a json'
            - generate_user_registration_logic(bad_config)
            output: 'ValueError: Invalid JSON configuration supplied to generate_user_registration_logic.'
          parameters:
          - description: A JSON‑encoded string describing the authentication setup
              (e.g., user model name, password hashing algorithm, required fields,
              email verification flow).
            name: config
            type: str
          raises:
          - description: If the JSON in `config` cannot be parsed or required configuration
              keys are missing.
            type: ValueError
          - description: If `config` is not a string.
            type: TypeError
          returns:
            description: A string containing the full source code for the registration
              component, ready to be written to a file or concatenated with other
              auth code.
            type: str
          summary: Generate user registration logic code from a JSON‑encoded authentication
            configuration.
      prompt: Generate Python (or relevant language) code that implements user registration
        using the provided authentication configuration. The `config` argument will
        be a JSON‑encoded string containing keys such as `user_model`, `password_hashing`,
        `email_verification`, etc. Return the complete registration module source
        code as a single string.
      shims: []
    - agent: false
      code_node_type: virtual-pure
      description: Generates the source code for login and logout functionality based
        on a given authentication configuration.
      implementation: "import json\n\n\ndef generate_login_logout_logic(config: str)\
        \ -> str:\n    \"\"\"\n    Generate Python source code implementing login\
        \ and logout functionality from\n    a serialized authentication configuration.\n\
        \n    Parameters\n    ----------\n    config : str\n        A serialized authentication\
        \ configuration (e.g., JSON) that\n        specifies required fields, validation\
        \ rules, session handling\n        strategy, and any third‑party auth integrations.\n\
        \n    Returns\n    -------\n    str\n        A string containing the complete\
        \ Python code for `login` and\n        `logout` functions, ready to be inserted\
        \ into the authentication\n        module.\n\n    Raises\n    ------\n   \
        \ ValueError\n        If the configuration is missing required keys such as\n\
        \        `login_endpoint` or `session_cookie_name`.\n    TypeError\n     \
        \   If `config` is not a string or cannot be parsed as valid JSON.\n    KeyError\n\
        \        If expected configuration fields are absent after parsing.\n\n  \
        \  Examples\n    --------\n    >>> config = '{\"login_endpoint\": \"/login\"\
        , \"logout_endpoint\": \"/logout\",\n    \"session_cookie_name\": \"session_id\"\
        , \"auth_method\": \"password\"}'\n    >>> code = generate_login_logout_logic(config)\n\
        \    'def login(request):\\n    # validate credentials\\n    ...\\n\\ndef\n\
        \    logout(request):\\n    # clear session\\n    ...'\n\n    >>> invalid_cfg\
        \ = 'not a json'\n    >>> generate_login_logout_logic(invalid_cfg)\n    ValueError:\
        \ Configuration string is not valid JSON.\n\n    \"\"\"\n    \n    try:\n\
        \        parsed_config = json.loads(config)\n    except json.JSONDecodeError:\n\
        \        raise ValueError(\"Configuration string is not valid JSON.\")\n \
        \   except TypeError:\n        raise TypeError(\"Config must be a string.\"\
        )\n    \n    required_keys = ['login_endpoint', 'logout_endpoint', 'session_cookie_name',\
        \ 'auth_method']\n    for key in required_keys:\n        if key not in parsed_config:\n\
        \            raise KeyError(f\"Required configuration field '{key}' is missing.\"\
        )\n    \n    login_endpoint = parsed_config['login_endpoint']\n    logout_endpoint\
        \ = parsed_config['logout_endpoint']\n    session_cookie_name = parsed_config['session_cookie_name']\n\
        \    auth_method = parsed_config['auth_method']\n    \n    login_code = f\"\
        \"\"def login(request):\n    if request.method != 'POST':\n        return\
        \ {{'error': 'Method not allowed'}}, 405\n    \n    credentials = request.get_json()\
        \ or {{}}\n    username = credentials.get('username')\n    password = credentials.get('password')\n\
        \    \n    if not username or not password:\n        return {{'error': 'Username\
        \ and password required'}}, 400\n    \n    if auth_method == 'password':\n\
        \        if validate_user_credentials(username, password):\n            session_id\
        \ = generate_session_id()\n            response = make_response({{'message':\
        \ 'Login successful'}})\n            response.set_cookie('{session_cookie_name}',\
        \ session_id, httponly=True, secure=True)\n            return response\n \
        \       else:\n            return {{'error': 'Invalid credentials'}}, 401\n\
        \    else:\n        return {{'error': 'Unsupported auth method'}}, 400\"\"\
        \"\n    \n    logout_code = f\"\"\"def logout(request):\n    session_id =\
        \ request.cookies.get('{session_cookie_name}')\n    \n    if session_id:\n\
        \        invalidate_session(session_id)\n    \n    response = make_response({{'message':\
        \ 'Logout successful'}})\n    response.set_cookie('{session_cookie_name}',\
        \ '', expires=0)\n    return response\"\"\"\n    \n    return login_code +\
        \ \"\\n\\n\" + logout_code"
      name: generate_login_logout_logic
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: config
        type: str
      prd:
        conceptual_info: This shim produces the login and logout implementation for
          the user authentication module, translating a high‑level configuration into
          executable Python code that can be compiled into the final authentication
          package.
        docstring:
          examples:
          - lines:
            - 'config = ''{"login_endpoint": "/login", "logout_endpoint": "/logout",
              "session_cookie_name": "session_id", "auth_method": "password"}'''
            - code = generate_login_logout_logic(config)
            output: '''def login(request):\n    # validate credentials\n    ...\n\ndef
              logout(request):\n    # clear session\n    ...'''
          - lines:
            - invalid_cfg = 'not a json'
            - generate_login_logout_logic(invalid_cfg)
            output: 'ValueError: Configuration string is not valid JSON.'
          parameters:
          - description: A serialized authentication configuration (e.g., JSON) that
              specifies required fields, validation rules, session handling strategy,
              and any third‑party auth integrations.
            name: config
            type: str
          raises:
          - description: If the configuration is missing required keys such as `login_endpoint`
              or `session_cookie_name`.
            type: ValueError
          - description: If `config` is not a string or cannot be parsed as valid
              JSON.
            type: TypeError
          - description: If expected configuration fields are absent after parsing.
            type: KeyError
