        \    trends', 'region breakdown', 'line chart')\n    'dashboard_2024_report_id_5678'\n\
        \n    \"\"\"\n    \n    if not isinstance(layout, str) or not layout.strip():\n\
        \        raise TypeError(\"Layout must be a non-empty string\")\n    if not\
        \ isinstance(aggregation, str) or not aggregation.strip():\n        raise\
        \ TypeError(\"Aggregation must be a non-empty string\")\n    if not isinstance(time_analytics,\
        \ str) or not time_analytics.strip():\n        raise TypeError(\"Time analytics\
        \ must be a non-empty string\")\n    if not isinstance(category_breakdown,\
        \ str) or not category_breakdown.strip():\n        raise TypeError(\"Category\
        \ breakdown must be a non-empty string\")\n    if not isinstance(charts, str)\
        \ or not charts.strip():\n        raise TypeError(\"Charts must be a non-empty\
        \ string\")\n    \n    required_keywords = ['layout', 'aggregation', 'analytics',\
        \ 'breakdown', 'chart']\n    combined_input = f\"{layout} {aggregation} {time_analytics}\
        \ {category_breakdown} {charts}\".lower()\n    \n    for keyword in required_keywords:\n\
        \        if keyword not in combined_input:\n            raise ValueError(f\"\
        Missing necessary contextual information: {keyword}\")\n    \n    current_year\
