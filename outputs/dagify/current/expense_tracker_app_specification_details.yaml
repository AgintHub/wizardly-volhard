        \ list with toggle switches for each notification type, positioned under a\
        \ header labeled 'Notification Preferences'.\"\n        else:\n          \
        \  wireframe_desc += f\"A clean interface layout designed to accommodate:\
        \ {requirement.lower()}.\"\n        \n        wireframes.append(wireframe_desc)\n\
        \    \n    return wireframes"
