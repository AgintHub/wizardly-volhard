        \n    hash_object = hashlib.md5(input_string.encode())\n    hash_id = hash_object.hexdigest()[:4]\n\
        \    \n    dashboard_id = f\"dashboard_{current_year}_report_id_{hash_id}\"\
        \n    \n    return dashboard_id"
