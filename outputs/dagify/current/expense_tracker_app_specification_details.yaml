        \        core domain.\n    TypeError\n        If the provided `domains` argument\
        \ is not of type `str`.\n\n    Examples\n    --------\n    >>> generate_reports_table('Users,Expenses,Categories')\n\
        \    \"CREATE TABLE Reports (\\n    report_id SERIAL PRIMARY KEY,\\n    user_id\n\
        \    INTEGER NOT NULL,\\n    expense_id INTEGER NOT NULL,\\n    category_id\
        \ INTEGER\n    NOT NULL,\\n    generated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\\\
        n\n    FOREIGN KEY (user_id) REFERENCES Users(user_id),\\n    FOREIGN KEY\n\
        \    (expense_id) REFERENCES Expenses(expense_id),\\n    FOREIGN KEY (category_id)\n\
        \    REFERENCES Categories(category_id)\\n);\"\n\n    >>> generate_reports_table('Users')\n\
        \    \"CREATE TABLE Reports (\\n    report_id SERIAL PRIMARY KEY,\\n    user_id\n\
        \    INTEGER NOT NULL,\\n    generated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\\\
        n\n    FOREIGN KEY (user_id) REFERENCES Users(user_id)\\n);\"\n\n    \"\"\"\
        \n    if not isinstance(domains, str):\n        raise TypeError(\"The provided\
        \ `domains` argument is not of type `str`.\")\n    \n    if not domains or\
        \ not domains.strip():\n        raise ValueError(\"The domains string is empty\
        \ or does not contain any recognizable core domain.\")\n    \n    domain_list\
        \ = [domain.strip() for domain in domains.split(',') if domain.strip()]\n\
        \    \n    if not domain_list:\n        raise ValueError(\"The domains string\
        \ is empty or does not contain any recognizable core domain.\")\n    \n  \
        \  sql_parts = [\"CREATE TABLE Reports (\"]\n    sql_parts.append(\"    report_id\
        \ SERIAL PRIMARY KEY,\")\n    \n    for domain in domain_list:\n        domain_lower\
        \ = domain.lower()\n        column_name = f\"{domain_lower}_id\"\n       \
        \ sql_parts.append(f\"    {column_name} INTEGER NOT NULL,\")\n    \n    sql_parts.append(\"\
        \    generated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,\")\n    \n    for domain\
        \ in domain_list:\n        domain_lower = domain.lower()\n        column_name\
        \ = f\"{domain_lower}_id\"\n        table_name = domain\n        primary_key\
        \ = f\"{domain_lower}_id\"\n        sql_parts.append(f\"    FOREIGN KEY ({column_name})\
        \ REFERENCES {table_name}({primary_key}),\")\n    \n    sql_parts[-1] = sql_parts[-1].rstrip(',')\n\
        \    sql_parts.append(\");\")\n    \n    return \"\\n\".join(sql_parts)"
