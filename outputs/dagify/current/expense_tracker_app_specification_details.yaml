        \ for col in columns])}\n              <td>\n                <button onClick={{()\
        \ => updateExpense(expense.id, expense)}}>Edit</button>\n                <button\
        \ onClick={{() => deleteExpense(expense.id)}}>Delete</button>\n          \
        \    </td>\n            </tr>\n          ))}}\n        </tbody>\n      </table>'''\n\
        \        elif structure_obj['layout'] == 'list':\n            item_template\
