    - agent: false
      code_node_type: virtual-pure
      description: Generates UI component names from requirement‑to‑pattern mappings.
      implementation: "from typing import List\n\nimport json\n\n\ndef generate_component_names(mappings:\
        \ str) -> List[str]:\n    \"\"\"\n    Generate concise UI component names\
        \ based on requirement‑to‑pattern\n    mappings.\n\n    Parameters\n    ----------\n\
        \    mappings : str\n        A JSON‑encoded string representing a dictionary\
        \ where each key is a\n        functional requirement (str) and each value\
        \ is the associated UI\n        design pattern (str).\n\n    Returns\n   \
        \ -------\n    list[str]\n        A list of component names derived from the\
        \ mappings, preserving the\n        order of the input requirements.\n\n \
        \   Raises\n    ------\n    ValueError\n        If the JSON string cannot\
        \ be parsed or does not represent a\n        dictionary of strings to strings.\n\
        \    TypeError\n        If any of the keys or values in the parsed dictionary\
        \ are not\n        strings.\n\n    Examples\n    --------\n    >>> generate_component_names('{\"\
        Add expense\": \"Form\", \"View report\":\n    \"Chart\"}')\n    ['AddExpenseForm',\
        \ 'ViewReportChart']\n\n    >>> generate_component_names('{\"Settings\": \"\
        Modal\", \"Help\": \"Drawer\"}')\n    ['SettingsModal', 'HelpDrawer']\n\n\
        \    \"\"\"\n    \n    try:\n        parsed_mappings = json.loads(mappings)\n\
        \    except json.JSONDecodeError:\n        raise ValueError(\"JSON string\
        \ cannot be parsed\")\n    \n    if not isinstance(parsed_mappings, dict):\n\
        \        raise ValueError(\"JSON does not represent a dictionary\")\n    \n\
        \    for key, value in parsed_mappings.items():\n        if not isinstance(key,\
        \ str) or not isinstance(value, str):\n            raise TypeError(\"Keys\
        \ and values in the dictionary must be strings\")\n    \n    component_names\
        \ = []\n    for requirement, pattern in parsed_mappings.items():\n       \
        \ requirement_words = requirement.replace(' ', '')\n        component_name\
        \ = requirement_words + pattern\n        component_names.append(component_name)\n\
        \    \n    return component_names"
