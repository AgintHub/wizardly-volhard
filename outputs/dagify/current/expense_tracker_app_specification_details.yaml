      implementation: "from typing import List\n\n\ndef validate_requirements_input(requirements:\
        \ str) -> List[str]:\n    \"\"\"\n    Validate and normalise a collection\
        \ of functional requirement strings.\n\n    Parameters\n    ----------\n \
        \   requirements : list[str]\n        A list of raw requirement strings produced\
        \ by the previous node.\n        Each string may contain leading/trailing\
        \ whitespace, inconsistent\n        capitalisation, or duplicates.\n\n   \
        \ Returns\n    -------\n    list[str]\n        A cleaned list where each requirement\
        \ is stripped of surrounding\n        whitespace, capitalised, non‑empty,\
        \ and unique while preserving the\n        original order of first occurrence.\n\
        \n    Raises\n    ------\n    ValueError\n        If any element is not a\
        \ string, is empty after stripping, or if\n        duplicate requirements\
        \ are detected.\n    TypeError\n        If the supplied `requirements` argument\
        \ is not iterable or not a\n        list of strings.\n\n    Examples\n   \
        \ --------\n    >>> validate_requirements_input(['track expenses', 'view reports'])\n\
        \    ['Track expenses', 'View reports']\n\n    >>> validate_requirements_input(['\
        \  add expense  ', 'Add Expense', ''])\n    ValueError: Requirements must\
        \ be non‑empty strings and unique.\n\n    \"\"\"\n    if not isinstance(requirements,\
        \ list):\n        raise TypeError(\"Requirements must be a list\")\n    \n\
        \    cleaned_requirements = []\n    seen = set()\n    \n    for req in requirements:\n\
        \        if not isinstance(req, str):\n            raise TypeError(\"If the\
        \ supplied `requirements` argument is not iterable or not a list of strings.\"\
        )\n        \n        stripped = req.strip()\n        if not stripped:\n  \
        \          raise ValueError(\"Requirements must be non‑empty strings and unique.\"\
        )\n        \n        capitalized = stripped.capitalize()\n        \n     \
        \   if capitalized in seen:\n            raise ValueError(\"Requirements must\
        \ be non‑empty strings and unique.\")\n        \n        seen.add(capitalized)\n\
        \        cleaned_requirements.append(capitalized)\n    \n    return cleaned_requirements"
      name: validate_requirements_input
