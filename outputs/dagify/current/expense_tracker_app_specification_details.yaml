        \ = r'(\\w+)\\(([^)]+)\\)'\n    matches = re.findall(table_pattern, db_tables)\n\
        \    \n    if not matches:\n        raise ValueError(\"No parsable table definitions\
        \ found\")\n    \n    result = {}\n    \n    for table_name, columns_str in\
        \ matches:\n        columns = {}\n        column_specs = [col.strip() for\
        \ col in columns_str.split(',')]\n        \n        for col_spec in column_specs:\n\
        \            if ':' not in col_spec:\n                continue\n         \
        \   \n            col_name, col_type = col_spec.split(':', 1)\n          \
        \  col_name = col_name.strip()\n            col_type = col_type.strip()\n\
        \            \n            validation_rule = {\n                \"type\":\
